name: Runner fallback

# Linux jobs run on GitHub's hosted runners first. When billing stops those (failed payment, spending
# limit reached), this re-runs the failed jobs, and a re-run (run_attempt > 1) goes to Coolify's
# self-hosted runners. The organization variable SELF_HOSTED=true skips the hosted attempt.
# Fork pull requests, comments on pull requests in public repositories, and issues or comments
# from outside the organization always stay on hosted runners, so strangers cannot run code on
# our server.
on:
  workflow_run:
    workflows:
      - Auto Manage
      - claude-ci
      - Claude Code Review
      - claude-fix-issue
      - claude
      - Build and Release
      - Test
      - Vouch (manage)
      - Vouch (PR gate)
    types: [completed]

permissions:
  actions: write
  checks: read

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: [self-hosted, linux, coolify]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Re-run on Coolify if billing stopped the hosted jobs
        run: |
          blocked=false
          for job in $(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" and (.runner_name // "") == "") | .id'); do
            if gh api "repos/$GH_REPO/check-runs/$job/annotations" --jq '.[].message' |
              grep -qiE "payments have failed|spending limit|billing"; then
              blocked=true
              break
            fi
          done
          if [ "$blocked" != true ]; then
            echo "Not a billing failure; nothing to do."
            exit 0
          fi
          # Re-running an older run would cancel a newer one on the same branch (cancel-in-progress).
          latest=$(gh api -X GET "repos/$GH_REPO/actions/workflows/$WORKFLOW_ID/runs" \
            -f branch="$BRANCH" -F per_page=1 --jq '.workflow_runs[0].id')
          if [ "$latest" != "$RUN_ID" ]; then
            echo "A newer run ($latest) exists on $BRANCH; not re-running $RUN_ID."
            exit 0
          fi
          gh run rerun "$RUN_ID" --failed
          echo "Re-running the failed jobs of $RUN_ID on Coolify."
