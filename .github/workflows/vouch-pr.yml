name: Vouch (PR gate)

# Auto-close PRs from unvouched or denounced users. Bots (ending with [bot])
# and collaborators with write access are automatically allowed.
# Runs under `pull_request_target` so the token can act on fork PRs.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: vouch-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - id: vouch
        uses: mitchellh/vouch/action/check-pr@v1
        with:
          pr-number: ${{ github.event.pull_request.number }}
          auto-close: true
          require-vouch: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label vouched PRs
        if: ${{ steps.vouch.outputs.status == 'vouched' || steps.vouch.outputs.status == 'allowed' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create vouched --repo "$REPO" --color 2da44e --description "Passed the vouch gate" --force
          gh pr edit "$PR" --repo "$REPO" --remove-label vouched || true
          gh pr edit "$PR" --repo "$REPO" --add-label vouched
